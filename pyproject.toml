[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upiguard"
version = "0.1.0"
description = "Synthetic-data UPI fraud detection prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.4",
  "networkx>=3.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "pydantic>=2.8",
  "scikit-learn>=1.5",
  "lightgbm>=4.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["api*", "ml*", "data*"]

[tool.ruff]
target-version = "py311"
line-length = 100
